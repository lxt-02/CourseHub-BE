services:
  identity-mysql:
    image: mysql:8.4
    container_name: identity-mysql
    environment:
      MYSQL_DATABASE: ${DB_NAME:-shopora_identity}
      MYSQL_USER: ${DB_USERNAME:-shopora}
      MYSQL_PASSWORD: ${DB_PASSWORD:-shopora}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - identity_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  identity_mysql_data:
